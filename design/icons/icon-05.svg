<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 05 玻璃拟态 · 深底光晕 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0D1F"/>
      <stop offset="1" stop-color="#131331"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <circle cx="300" cy="260" r="330" fill="url(#glow1)"/>
  <circle cx="760" cy="780" r="360" fill="url(#glow2)"/>
  <!-- 玻璃电视 -->
  <rect x="196" y="308" width="560" height="350" rx="30" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.5)" stroke-width="12"/>
  <!-- 三条波纹 -->
  <circle cx="476" cy="560" r="15" fill="rgba(255,255,255,0.95)"/>
  <path d="M 415.4 525 A 70 70 0 0 1 536.6 525" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="13" stroke-linecap="round"/>
  <path d="M 376.4 502.5 A 115 115 0 0 1 575.6 502.5" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="13" stroke-linecap="round"/>
  <path d="M 337.4 480 A 160 160 0 0 1 614.6 480" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="13" stroke-linecap="round"/>
  <!-- 底座 -->
  <path d="M 400 658 L 380 716" stroke="rgba(255,255,255,0.5)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 552 658 L 572 716" stroke="rgba(255,255,255,0.5)" stroke-width="12" stroke-linecap="round"/>
  <!-- 玻璃 iPhone -->
  <rect x="620" y="430" width="180" height="330" rx="36" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.5)" stroke-width="12"/>
  <rect x="674" y="452" width="72" height="20" rx="10" fill="rgba(255,255,255,0.9)"/>
