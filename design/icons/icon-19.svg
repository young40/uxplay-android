      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- 电视（左，白实心） -->
  <rect x="130" y="340" width="400" height="280" rx="26" fill="#FFFFFF"/>
  <rect x="158" y="368" width="344" height="224" rx="14" fill="#1E3A8A"/>
  <rect x="230" y="620" width="24" height="52" rx="12" fill="#FFFFFF"/>
  <rect x="406" y="620" width="24" height="52" rx="12" fill="#FFFFFF"/>
