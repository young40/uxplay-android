  <circle cx="700" cy="450" r="15" fill="#FFFFFF"/>
  <path d="M 672.5 497.6 A 55 55 0 0 0 672.5 402.4" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
  <path d="M 652.5 532.3 A 95 95 0 0 0 652.5 367.7" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
  <path d="M 632.5 566.9 A 135 135 0 0 0 632.5 333.1" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
  <!-- iPhone（右，灵动岛） -->
  <rect x="720" y="270" width="180" height="360" rx="36" fill="rgba(255,255,255,0.08)" stroke="#FFFFFF" stroke-width="13"/>
  <rect x="770" y="292" width="80" height="22" rx="11" fill="#FFFFFF"/>
</svg>
