<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 03 紫粉渐变 · 并排构图白线稿 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- 电视（左） -->
  <rect x="130" y="340" width="400" height="280" rx="26" fill="rgba(255,255,255,0.08)" stroke="#FFFFFF" stroke-width="13"/>
  <rect x="230" y="620" width="24" height="52" rx="12" fill="#FFFFFF"/>
  <rect x="406" y="620" width="24" height="52" rx="12" fill="#FFFFFF"/>
